<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Jumpscore</title>
<style>
  html, body { margin: 0; height: 100%; background: #15171d; overflow: hidden; touch-action: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// ---------- tuning ----------
const BPM = 100, BEAT = 60 / BPM, STEP = BEAT / 4, BAR = BEAT * 4;
const TOTAL_BARS = 40;            // song length (~96s)
const SPEED = 260;                // world scroll, px per second
const GRAV = 2200, FALL_GRAV = 1.4;
const HANG_V = 140, HANG_GRAV = 0.5;   // near the top of an arc gravity softens: a brief hang to aim
// every launch has a small fixed impulse; holding keeps that speed for up to HOLD_TIME (variable height)
const JUMP_V = 620, BOUNCE_V = 640, CHAIN_BOOST = 12, AIR_JUMP_V = 500, HOLD_TIME = 0.18;
const DIVE_V = 1100;              // air press with a shape below: drop fast into it
const BACK_REACH = 36;            // a dive may slide the player this far back to catch a shape just passed
const STEER_V = 700, RETURN_V = 160;   // px/s: sliding toward a dive target, and drifting back afterwards
const PERFECT_WIN = 0.07;         // seconds from the shape's beat that count as "perfect"
const PERFECT_BOUNCE = 1.12, SLAM_BOUNCE = 1.35, GRACE_V = 420;
const MAGNET = 22;                // extra reach within which the player is pulled toward a shape
const HITSTOP = 0.05;
const LEVEL_BASE = 90, LEVEL_GAP = 60, MAX_LEVEL = 9;
const PLAYER_H = 44, SHAPE_R = 24, GRACE_R = 11, GRACE_H = 80, NPTS = 48;
const GROUND_F = 0.78;            // ground line position (fraction of screen height)

// ---------- palette (soft, low-contrast-but-readable) ----------
const LINE = '#aeb7c4';
const lineA = a => `rgba(174,183,196,${a})`;
const FLASH = '#e3e8ef';
const HUES = [205, 180, 150, 100, 50, 25, 350, 315, 280, 240];
const SIDES = [3, 4, 5, 6, 8, 3, 4, 5, 6, 8];   // circles are reserved for held notes
const shapeCol = (lvl, a = 1) => `hsla(${HUES[lvl % HUES.length]},30%,74%,${a})`;

// ---------- canvas ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, S, DPR, PX, GY;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = innerWidth * DPR; cv.height = innerHeight * DPR;
  S = Math.max(0.55, Math.min(innerWidth / 1000, innerHeight / 640, 1.4));
  W = innerWidth / S; H = innerHeight / S;
  PX = Math.max(110, W * 0.24);
  GY = H * GROUND_F;
}
addEventListener('resize', resize); resize();

// ---------- utils ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const NOTE = n => 440 * Math.pow(2, (n - 69) / 12);
const pc = o => ((o % 12) + 12) % 12;
function rngFrom(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function loadBest() { try { return +localStorage.getItem('jumpscore.best') || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem('jumpscore.best', String(v)); } catch (e) {} }

// ---------- audio ----------
let ac, master, revSend, delaySend, noiseBuf, analyser, waveBuf;
function initAudio() {
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 3;
  master = ac.createGain(); master.gain.value = 0.85;
  master.connect(comp).connect(ac.destination);
  analyser = ac.createAnalyser(); analyser.fftSize = 2048;
  waveBuf = new Float32Array(analyser.fftSize);
  comp.connect(analyser);

  // generated reverb impulse
  const len = ac.sampleRate * 2.8, ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = ir.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  }
  const rev = ac.createConvolver(); rev.buffer = ir;
  revSend = ac.createGain(); revSend.gain.value = 0.3;
  revSend.connect(rev).connect(master);

  // dotted-eighth feedback delay
  const dl = ac.createDelay(2); dl.delayTime.value = BEAT * 0.75;
  const fb = ac.createGain(); fb.gain.value = 0.33;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
  delaySend = ac.createGain(); delaySend.gain.value = 0.22;
  delaySend.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(master); lp.connect(revSend);

  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
}

function osc(type, freq, t, dur, dest) {
  const o = ac.createOscillator();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  o.connect(dest); o.start(t); o.stop(t + dur + 0.05);
  return o;
}
function pad(notes, t, dur) {
  const g = ac.createGain(), f = ac.createBiquadFilter();
  f.type = 'lowpass'; f.Q.value = 0.4;
  f.frequency.setValueAtTime(600, t);
  f.frequency.linearRampToValueAtTime(1200, t + dur * 0.5);
  f.frequency.linearRampToValueAtTime(700, t + dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.022, t + 0.6);
  g.gain.setValueAtTime(0.022, t + dur - 0.1);
  g.gain.linearRampToValueAtTime(0, t + dur + 0.7);
  g.connect(f); f.connect(master); f.connect(revSend);
  for (const n of notes) for (const dt of [-8, 8]) osc('sawtooth', NOTE(n), t, dur + 0.8, g).detune.value = dt;
}
function bass(n, t, dur, v = 0.24) {
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + 0.01);
  g.gain.setValueAtTime(v, t + dur * 0.6);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  g.connect(master);
  osc('sine', NOTE(n), t, dur, g);
  const g2 = ac.createGain(); g2.gain.value = 0.2; g2.connect(g);
  osc('triangle', NOTE(n), t, dur, g2);
}
function kick(t, v = 0.5) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(130, t);
  o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
  g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
  o.connect(g).connect(master); o.start(t); o.stop(t + 0.4);
}
function noise(t, dur, type, freq, q, v, toRev) {
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(master);
  if (toRev) g.connect(revSend);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
function snare(t) {
  noise(t, 0.18, 'bandpass', 1900, 0.8, 0.13, true);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
  g.connect(master); osc('triangle', 190, t, 0.1, g);
}
function pluck(n, t, v = 0.045) {
  const f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'lowpass';
  f.frequency.setValueAtTime(2600, t); f.frequency.exponentialRampToValueAtTime(450, t + 0.25);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
  osc('sawtooth', NOTE(n), t, 0.32, f);
  f.connect(g); g.connect(master); g.connect(delaySend);
}
// bright: 0..1+, more upper partials (longer chains and perfect hits ring brighter)
function bell(n, t, v = 0.22, bright = 0) {
  const f0 = NOTE(n), g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
  g.connect(master); g.connect(revSend); g.connect(delaySend);
  osc('sine', f0, t, 1.7, g);
  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0.35 + 0.25 * bright, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
  g2.connect(g); osc('sine', f0 * 2, t, 0.6, g2);
  const g3 = ac.createGain();
  g3.gain.setValueAtTime(0.12 + 0.15 * bright, t); g3.gain.exponentialRampToValueAtTime(0.001, t + 0.18 + 0.1 * bright);
  g3.connect(g); osc('sine', f0 * 3.01, t, 0.3, g3);
}
// sustained note for held (circle) shapes; returns its gain so an early release can fade it
function hum(n, t, dur, v) {
  const f0 = NOTE(n), g = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + 0.02);
  g.gain.setValueAtTime(v, t + dur);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.5);
  g.connect(master); g.connect(revSend);
  lfo.frequency.value = 5.5; lg.gain.value = 7; lfo.connect(lg);
  for (const [type, mul, gain] of [['sine', 1, 1], ['triangle', 2, 0.22]]) {
    const gg = ac.createGain(); gg.gain.value = gain; gg.connect(g);
    lg.connect(osc(type, f0 * mul, t, dur + 0.55, gg).detune);
  }
  lfo.start(t); lfo.stop(t + dur + 0.6);
  return g;
}
function ting(n, t, v = 0.09) {
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
  g.connect(master); g.connect(delaySend);
  osc('sine', NOTE(n), t, 0.32, g);
  const g2 = ac.createGain(); g2.gain.value = 0.3; g2.connect(g);
  osc('triangle', NOTE(n) * 2, t, 0.32, g2);
}
function thump(t, f0, v) {
  const g = ac.createGain(), o = ac.createOscillator();
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * 0.55, t + 0.08);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
  o.connect(g).connect(master); o.start(t); o.stop(t + 0.12);
}

// ---------- song ----------
// Diatonic seventh chords as semitone offsets from the (minor) key root.
const CH = { i: [0, 3, 7, 10], iv: [5, 8, 12, 15], v: [7, 10, 14, 17], III: [3, 7, 10, 14], VI: [8, 12, 15, 19], VII: [10, 14, 17, 20] };
const PROGS = [
  [CH.i, CH.VI, CH.III, CH.VII],
  [CH.i, CH.iv, CH.VI, CH.v],
  [CH.i, CH.VII, CH.VI, CH.VII],
  [CH.VI, CH.VII, CH.i, CH.i],
];
const KEYS = [48, 50, 52, 53];
let song = null;
// 0..4: how many layers of the band are playing; earned by hitting shapes, lost by landing or missing
let energy = 0;

function chordAt(bar) {
  if (bar >= TOTAL_BARS - 1) return CH.i;
  return song.prog[((bar % 4) + 4) % 4];
}
const padNote = o => song.key + 7 + pc(pc(o) - 7);
const bassNote = o => song.key - 12 + pc(o) - (pc(o) > 6 ? 12 : 0);
// Chord tones stacked upward: index = shape level, so higher shapes = higher notes, always in harmony.
function chordTones(bar) {
  const pcs = [...new Set(chordAt(bar).map(pc))].sort((a, b) => a - b), out = [];
  for (let oc = 0; oc < 4; oc++) for (const p of pcs) out.push(song.key + 12 + oc * 12 + p);
  return out;
}
// When to play a hit's note: on the next 32nd of the song grid, so it always lands in time.
function snapTime() {
  const now = ac.currentTime, g = STEP / 2;
  const t = song.start + Math.ceil((now - song.start - 0.02) / g) * g;
  return Math.max(t, now + 0.005);
}

const BASS_PAT = { 0: 0, 6: 0, 8: 7, 10: 0, 14: 12 };
const ARP = [0, 1, 2, 3, 4, 3, 2, 1];
function scheduleStep(step, t) {
  const bar = Math.floor(step / 16), s = step % 16;
  if (bar >= TOTAL_BARS) return;
  const ch = chordAt(bar), last = bar === TOTAL_BARS - 1;
  const calm = bar < 4 || bar >= 36;              // intro and outro stay sparse
  const L = calm ? 0 : Math.floor(energy);         // layers: 1 bass groove, 2 kick+hats, 3 snare, 4 arpeggio
  const root = bassNote(ch[0]);

  if (s === 0) pad(ch.map(padNote), t, last ? BAR * 1.1 : BAR);

  if (L >= 1) { if (s in BASS_PAT) bass(root + BASS_PAT[s], t, STEP * 1.8); }
  else if (s === 0) bass(root, t, last ? BAR * 1.1 : BAR * 0.95, 0.2);

  if (L >= 2) {
    if (s === 0 || s === 8 || (L >= 3 && s === 10 && bar % 2)) kick(t);
    if (s % 4 === 2) noise(t, 0.05, 'highpass', 7000, 0.7, 0.065);
    if (L >= 3 && s % 4 === 0) noise(t, 0.05, 'highpass', 7000, 0.7, 0.03);
  }
  if (L >= 3 && (s === 4 || s === 12)) snare(t);
  if (L >= 4) {
    const tones = chordTones(bar), dense = bar >= 24 && bar < 32;
    if (dense || s % 2 === 0) pluck(tones[ARP[(dense ? s : s / 2) % 8]], t, dense && s % 2 ? 0.028 : 0.045);
  }
  if (last && s === 0) bell(song.key + 24, t + 0.02, 0.12);
}
function scheduler() {
  if (!song || !ac) return;
  while (song.nextT < ac.currentTime + 0.12) {
    scheduleStep(song.step, song.nextT);
    song.step++;
    song.nextT = song.start + song.step * STEP;
  }
}
setInterval(scheduler, 25);

// ---------- level generation: melodic phrases (up, down, repeated notes) on a 16th grid ----------
const levelH = l => LEVEL_BASE + l * LEVEL_GAP;
// Height gained t seconds after a bounce: holding the full boost (highest) or releasing at once (lowest).
function riseAt(t, v, hold) {
  if (hold) return t < HOLD_TIME ? v * t : v * HOLD_TIME + riseAt(t - HOLD_TIME, v, false);
  const tp = v / GRAV;
  if (t <= tp) return v * t - GRAV * t * t / 2;
  return v * tp / 2 - GRAV * FALL_GRAV * (t - tp) ** 2 / 2;
}
const GAP_CHOICES = [4, 6, 3, 8, 5, 2];   // in 16ths, most musical first
// Pick a gap after which a shape at level `to` is reachable by bouncing off `from` (no air jump needed).
function gapFor(from, to, rng) {
  const b0 = levelH(from) - 40, c = levelH(to), v = BOUNCE_V + CHAIN_BOOST * 2;
  const ok = GAP_CHOICES.filter(k => {
    const t = k * STEP;
    return b0 + riseAt(t, v, true) >= c - 60 && b0 + riseAt(t, v, false) <= c + 16;
  });
  if (!ok.length) return 0;
  return ok.length > 1 && rng() < 0.25 ? ok[1] : ok[0];
}
const INTERVALS = [-2, -1, -1, 0, 0, 1, 1, 1, 2, 2];
// kinds: note (bounce), hold (circle you ride for a beat), chord (two stacked notes), grace (small low hop)
function genShapes(rng) {
  const out = [], end = Math.floor((TOTAL_BARS * BAR - 2) / STEP);   // shapes until 2s before the song ends
  let ph = 0;
  const add = (step, l, kind = 'note') => out.push({
    t: step * STEP, level: l, kind, ph, sides: kind === 'hold' ? 0 : SIDES[l], len: kind === 'hold' ? BEAT : 0,
    phase: rng() * 6.28, spin: (rng() < 0.5 ? -1 : 1) * (0.5 + rng() * 0.6), hit: false, hitT: 0, missed: false,
  });
  const kindFor = (l, prog) => {
    const r = rng();
    if (r < 0.1 + prog * 0.06) return 'hold';
    if (r < 0.2 + prog * 0.08 && l < MAX_LEVEL) return 'chord';
    return 'note';
  };
  let s = 32;
  while (s < end) {
    const prog = s / end;
    ph++;
    if (rng() < 0.2) { add(s, Math.floor(rng() * 2)); s += 8; continue; }
    // a short motif, then the motif again (sometimes inverted) — call and answer
    const motif = Array.from({ length: 2 + Math.floor(rng() * 3) }, () => INTERVALS[Math.floor(rng() * INTERVALS.length)]);
    const steps = motif.concat(rng() < 0.5 ? motif : motif.map(x => -x));
    let l = Math.floor(rng() * (2 + prog * 2)), kind = 'note';
    add(s, l);
    for (const iv of steps) {
      let nl = l + iv + (rng() < 0.1 + prog * 0.2 ? 1 : 0);
      if (nl < 0 || nl > MAX_LEVEL) nl = l - iv;
      nl = clamp(nl, 0, MAX_LEVEL);
      const held = kind === 'hold' ? 4 : 0;   // a held note releases you one beat later
      const k = gapFor(l, nl, rng);
      if (!k || s + held + k >= end) break;
      s += held + k; kind = kindFor(nl, prog); add(s, nl, kind); l = nl;
    }
    if (kind === 'hold') s += 4;
    // grace notes in the rest: quick low hops on eighths
    let g = s + 6;
    if (rng() < 0.45) {
      const n = 2 + Math.floor(rng() * 3);
      for (let i = 0; i < n && g < end; i++, g += 2) {
        out.push({ t: g * STEP, level: 0, kind: 'grace', ph: -1, gi: i, sides: 4, len: 0, phase: Math.PI / 4, spin: 0, hit: false, hitT: 0, missed: false });
      }
    }
    s = Math.ceil((Math.max(s + 8, g + 4) + rng() * 8) / 4) * 4;   // rest, then start the next phrase on a beat
  }
  return out;
}
const shapeH = (sh, t) => sh.kind === 'grace' ? GRACE_H + Math.sin(t * 3 + sh.t) * 3 : levelH(sh.level) + Math.sin(t * 2 + sh.phase) * 6;

// ---------- outlines (everything is a closed loop of NPTS points so it can morph) ----------
function outlinePts(sides, r, rot, cx, cy, out) {
  for (let i = 0; i < NPTS; i++) {
    const u = i / NPTS;
    if (!sides) {
      const a = Math.PI / 2 + rot + u * Math.PI * 2;
      out[i * 2] = cx + Math.cos(a) * r; out[i * 2 + 1] = cy + Math.sin(a) * r;
      continue;
    }
    const f = u * sides, k = Math.floor(f), fr = f - k;
    const a0 = Math.PI / 2 + rot + k / sides * Math.PI * 2, a1 = a0 + Math.PI * 2 / sides;
    out[i * 2] = cx + (Math.cos(a0) * (1 - fr) + Math.cos(a1) * fr) * r;
    out[i * 2 + 1] = cy + (Math.sin(a0) * (1 - fr) + Math.sin(a1) * fr) * r;
  }
  return out;
}
// The player's line is the same loop collapsed onto a vertical segment (up, then back down).
function linePts(h, out) {
  for (let i = 0; i < NPTS; i++) {
    const u = i / NPTS, p = u < 0.5 ? u * 2 : 2 - u * 2;
    out[i * 2] = 0; out[i * 2 + 1] = -p * h;
  }
  return out;
}
function strokeLoop(pts, ox, oy, col, lw) {
  ctx.beginPath();
  ctx.moveTo(ox + pts[0], oy + pts[1]);
  for (let i = 1; i < NPTS; i++) ctx.lineTo(ox + pts[i * 2], oy + pts[i * 2 + 1]);
  ctx.closePath();
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.stroke();
}
function dot(x, y, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function dotted(x0, y0, x1, y1, gap, col, skip0 = 0, skip1 = 0) {
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
  ctx.fillStyle = col;
  for (let d = skip0 + 4; d < L - skip1 - 4; d += gap) ctx.fillRect(x0 + dx * d / L - 0.8, y0 + dy * d / L - 0.8, 1.6, 1.6);
}

// ---------- game state ----------
let state = 'title', songT = 0, idleT = 0, endT = 0, camH = 0;
// wt = world time: song time minus a small lag that hit-stop adds and then catches up
let wt = 0, lag = 0, hitStop = 0, camKick = 0;
let shapes = [], ripples = [], parts = [], pops = [], trails = [];
let score = 0, best = loadBest(), newBest = false, stats = null;
const input = { held: false };
// background tint follows the last shape hit
const BG_BASE = { h: 225, s: 14, l: 10 };
const bg = { ...BG_BASE }, bgTarget = { ...BG_BASE };
const bgCol = (a = 1) => `hsla(${bg.h},${bg.s}%,${bg.l}%,${a})`;
const PLAYER_RESET = { h: 0, vy: 0, ground: true, airJump: true, boost: 0, diving: false, ride: null, hint: null, diveSh: null, bufMode: 'smart', dx: 0, flash: 0,
  chain: 0, jumpBuf: 0, sq: 1, rot: 0, spin: 0, form: null, m: 1 };
const player = { ...PLAYER_RESET, pts: new Float32Array(NPTS * 2), from: new Float32Array(NPTS * 2), tgt: new Float32Array(NPTS * 2) };
linePts(PLAYER_H, player.pts);

const stars = Array.from({ length: 80 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.1 + 0.4, a: Math.random() * 0.25 + 0.06 }));

function morphTo(form) {
  player.from.set(player.pts);
  player.form = form; player.m = 0;
}
function resetPlayer() {
  Object.assign(player, PLAYER_RESET);
  linePts(PLAYER_H, player.pts);
}

function startGame() {
  if (!ac) initAudio();
  if (ac.state === 'suspended') ac.resume();
  const rng = rngFrom((Math.random() * 1e9) | 0);
  song = { key: KEYS[Math.floor(rng() * KEYS.length)], prog: PROGS[Math.floor(rng() * PROGS.length)], start: ac.currentTime + 0.15, step: 0 };
  song.nextT = song.start;
  shapes = genShapes(rng);
  ripples = []; parts = []; pops = []; trails = [];

// ---------- input ----------

const KEY_MODES = { Space: 'smart', Enter: 'smart', KeyZ: 'smart', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down' };

addEventListener('pointerup', release);
addEventListener('pointercancel', release);

// ---------- effects ----------

}

// ---------- update ----------
function update(dt) {

  }

  ctx.setTransform(S * DPR, 0, 0, S * DPR, 0, 0);
  drawHud();
  if (state === 'end') drawEnd();
}

function drawPlayer() {

  const k = ease(p.m);
  for (let i = 0; i < NPTS * 2; i++) p.pts[i] = p.from[i] + (p.tgt[i] - p.from[i]) * k;
  const col = p.form ? shapeCol(p.form.level, 1) : LINE;
  ctx.shadowColor = col; ctx.shadowBlur = 8 + Math.min(p.chain, 8) * 1.5 + p.flash * 10;
  strokeLoop(p.pts, PX + p.dx, sy(p.h), col, 2.4);
  if (p.flash > 0) {
    ctx.globalAlpha = p.flash;
    ctx.shadowColor = FLASH;
    strokeLoop(p.pts, PX + p.dx, sy(p.h), FLASH, 2.4);
    ctx.globalAlpha = 1;
  }
  ctx.shadowBlur = 0;
  if (p.ground) dot(PX + p.dx, sy(0), 2.6, LINE);
  else if (p.airJump && !p.ride) dot(PX + p.dx, sy(p.h) + 7, 2, lineA(0.7));   // air jump still available
  if (p.diving) {   // speed trail above the player
    const top = p.h + PLAYER_H * (p.form ? 1 : p.sq);
    for (let i = 1; i <= 6; i++) ctx.fillStyle = lineA(0.5 - i * 0.07), ctx.fillRect(PX + p.dx - 1, sy(top + i * 10) - 1, 2, 2);
  }
}

// the music's waveform, drawn faint behind everything in the background's own hue
function drawWave() {
  if (!analyser) return;
  analyser.getFloatTimeDomainData(waveBuf);
  let start = 0;
  for (let i = 1; i < waveBuf.length / 2; i++) if (waveBuf[i - 1] < 0 && waveBuf[i] >= 0) { start = i; break; }
  const n = waveBuf.length / 2, cy = H * 0.42, amp = H * 0.5;
  ctx.beginPath();
  for (let i = 0; i < n; i += 2) {
    const x = i / n * W, y = cy - clamp(waveBuf[start + i] * amp, -H * 0.3, H * 0.3);
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
  ctx.strokeStyle = `hsla(${bg.h},${bg.s + 6}%,52%,0.22)`; ctx.lineWidth = 1.4; ctx.stroke();
}

function drawHud() {
  const prog = clamp(songT / (TOTAL_BARS * BAR), 0, 1);
  ctx.strokeStyle = lineA(0.15); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(24, 18); ctx.lineTo(W - 24, 18); ctx.stroke();
  ctx.strokeStyle = lineA(0.55);
  ctx.beginPath(); ctx.moveTo(24, 18); ctx.lineTo(24 + (W - 48) * prog, 18); ctx.stroke();
  dot(24 + (W - 48) * prog, 18, 2.6, LINE);

  text(String(score), 24, 50, 30, LINE, 'left', 300);
  // band layers: one point per instrument group currently playing
  for (let i = 0; i < 4; i++) {
    const on = energy >= i + 1, part = clamp(energy - i, 0, 1);
    dot(28 + i * 12, 76, on ? 2.6 : 1.8, on ? shapeCol(i * 2, 0.9) : lineA(0.15 + part * 0.3));
  }
  if (player.chain > 1) text('×' + player.chain, 24, 98, 16, shapeCol(Math.min(player.chain, MAX_LEVEL), 0.9), 'left', 400);
  text('best ' + best, W - 24, 50, 15, lineA(0.55), 'right', 300, 1);
}

function drawTitle(t) {
  // drifting demo shapes
  for (let i = 0; i < 6; i++) {
    const x = ((W * (0.15 + i * 0.17) - t * 30) % (W + 80) + W + 80) % (W + 80) - 40;
    const h = levelH(i) + Math.sin(t * 1.5 + i) * 8;
    shapeOutline(i === 4 ? 0 : SIDES[i], x, sy(h), SHAPE_R, t * 0.6 * (i % 2 ? 1 : -1) + i, shapeCol(i, 0.45), 1.5);
  }
  linePts(PLAYER_H, tmp);
  strokeLoop(tmp, PX, sy(0), LINE, 2.4);
  dot(PX, sy(0), 2.6, LINE);

  text('jumpscore', W / 2, H * 0.3, 54, LINE, 'center', 200, 10);
  text('jump into the shapes to play the song — hit them on the beat', W / 2, H * 0.3 + 52, 16, lineA(0.6), 'center', 300, 1);
  text('space · click · tap   —   hold to jump higher   —   tap in the air to jump again, or to dive', W / 2, H * 0.3 + 80, 14, lineA(0.4), 'center', 300, 1);
  text('↑ / W always jumps   ·   ↓ / S always dives', W / 2, H * 0.3 + 100, 13, lineA(0.32), 'center', 300, 1);
  const a = 0.35 + 0.3 * Math.sin(t * 3) ** 2;
  text('press to begin', W / 2, H * 0.3 + 130, 15, lineA(a), 'center', 400, 3);
  if (best) text('best ' + best, W / 2, H * 0.3 + 160, 13, lineA(0.35), 'center', 300, 2);
  text('Created by Tomazella Games with Claude Code', W / 2, H - 22, 12, lineA(0.38), 'center', 300, 2);
}

function drawEnd() {
  const k = ease(endT / 0.8);
  ctx.fillStyle = bgCol(0.82 * k); ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = k;
  const cy = H * 0.36;
  text('the song is over', W / 2, cy - 60, 15, lineA(0.55), 'center', 300, 3);
  text(String(score), W / 2, cy, 64, LINE, 'center', 200, 2);
  text(newBest ? 'new best' : 'best ' + best, W / 2, cy + 52, 16, newBest ? shapeCol(3, 1) : lineA(0.55), 'center', 400, 3);
  ctx.strokeStyle = lineA(0.2); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(W / 2 - 120, cy + 82); ctx.lineTo(W / 2 + 120, cy + 82); ctx.stroke();
  text(`notes ${stats.hits} / ${stats.total}   ·   perfect ${stats.perfect}   ·   longest chain ${stats.chain}   ·   highest note ${stats.top + 1}`,
    W / 2, cy + 108, 13, lineA(0.5), 'center', 300, 1);
  if (endT > 1.2) text('press to play again', W / 2, cy + 160, 14, lineA(0.35 + 0.3 * Math.sin(endT * 3) ** 2), 'center', 400, 3);
  text('Created by Tomazella Games with Claude Code', W / 2, H - 22, 12, lineA(0.38), 'center', 300, 2);
  ctx.globalAlpha = 1;
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  draw(update(dt));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
